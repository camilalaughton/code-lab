<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Encanto</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- HEADER ------------------------------------------------>
    <header id="logo">
        <div>
            <h1>Loja Encanto</h1>
            <span class="subtitle">Roupas e Acessórios</span>
        </div>

        <!-- NAV ------------------------------------------------>
        <nav id="menu">
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Categorias</a></li>
                <li class="icons"><i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-whatsapp"></i><a href="#"></a></li>
            </ul>
         </nav>
    </header>

    <!-- MAIN ------------------------------------------------>
    <main>
        <section>
            <div class="cards">
                <div class="card-blusa">
                    <img src="" alt="imagem de uma blusa">
                    <h2 class="cards">Camiseta Básica</h2>
                    <span>R$ 49,90</span>
                    <button type="submit">Adicionar ao carrinho</button>
                </div>

                <div class="card-moletom">
                    <img src="" alt="imagem de um moletom">
                    <h2 class="cards">Moletom</h2>
                    <span>R$ 89,90</span>
                    <button type="submit">Adicionar ao carrinho</button>
                </div>

                <div class="card-oculos">
                    <img src="" alt="imagem de um óculos de sol">
                    <h2 class="cards">Óculos de sol</h2>
                    <span>R$ 59,90</span>
                    <button type="submit">Adicionar ao carrinho</button>
                </div>

                <div class="card-bone">
                    <img src="" alt="imagem de um boné">
                    <h2 class="cards">Boné</h2>
                    <span>R$ 35,90</span>
                    <button type="submit">Adicionar ao carrinho</button>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER ------------------------------------------------>
    <footer>
        <div class="contato">
            <h2>Contato</h2>
            <a href="">contato@lojaencanto.com</a>
            <a href="">(11) 99999-9999</a>
            <a href="">São Paulo - SP, CEP: 12300-123</a>
        </div>
        <p class="copy">&copy; 2026 Loja Encanto. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
